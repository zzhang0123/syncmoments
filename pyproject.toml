[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "syncmoments"
version = "0.5.0"
description = "Differentiable synchrotron kernels and explicitly scoped statistical approximations"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["jax>=0.10,<0.11", "equinox>=0.13.7,<0.14", "numpy>=2.3,<3"]

[project.urls]
Homepage = "https://github.com/zzhang0123/syncmoments"
Documentation = "https://syncmoments.readthedocs.io"
Changelog = "https://github.com/zzhang0123/syncmoments/blob/main/CHANGELOG.md"

[project.optional-dependencies]
validation = ["scipy>=1.16,<2", "matplotlib>=3.10,<4", "pytest>=8,<10"]
high_harmonic = ["scipy>=1.16,<2"]
dev = ["black>=25", "ruff>=0.12"]
docs = ["sphinx>=8,<9", "myst-parser>=4,<5", "furo>=2024.8"]

[tool.setuptools.packages.find]
include = ["syncmoments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]
markers = ["slow: long-running tests, excluded with -m 'not slow'"]

[tool.ruff]
# Verbatim copy of the manuscript reference; its hashes are checked by a test.
extend-exclude = ["tests/model/reference"]

[tool.ruff.lint]
# I is the physical Stokes-I symbol throughout this package.
ignore = ["E741"]

[tool.black]
target-version = ["py312"]
extend-exclude = "tests/model/reference/"
